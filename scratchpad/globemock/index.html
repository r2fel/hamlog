<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css">
<link rel="stylesheet" href="/public/fonts/fonts.css">
<style>
  :root { --chassis:#1c1b19; --panel:#26241f; --line:#443f37; --amber:#e8a23d; --green:#7ea36b; --text:#ece7d8; --dim:#9c9587; }
  html,body { margin:0; background:var(--chassis); color:var(--text); font-family:'IBM Plex Mono',monospace; }
  .block { margin:14px; border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden; }
  .head { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line);
          font:700 13px 'Barlow Condensed',sans-serif; letter-spacing:.08em; }
  .head .route { color:var(--amber); }
  .head .km { margin-left:auto; color:var(--text); font-family:'IBM Plex Mono'; font-weight:500; font-size:13px; }
  .head button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:4px; font:600 11px 'Barlow Condensed'; padding:2px 7px; }
  #map { height: var(--h, 360px); background:#0b0b0a; }
  .note { padding:6px 12px; font:12px -apple-system,sans-serif; color:var(--dim); border-top:1px solid var(--line); }
</style></head>
<body>
<div class="block">
  <div class="head"><span>🌍 GLOBE</span><span class="route" id="route"></span><span class="km" id="km"></span>
    <button>LONG PATH</button><button>⧉ WINDOW</button></div>
  <div id="map"></div>
  <div class="note" id="note"></div>
</div>
<script type="module">
import * as maplibregl from '/node_modules/maplibre-gl/dist/maplibre-gl.mjs';
const P = new URLSearchParams(location.search);
const me = { call: 'R2FEL', grid: 'KO04FR' }, them = { call: P.get('call') || 'K1TEST', grid: P.get('grid') || 'FN42KH' };
const zoomIn = P.get('zoom') === '1';
document.documentElement.style.setProperty('--h', (P.get('h') || 360) + 'px');
function gridCenter(g) { g = g.toUpperCase();
  let lon = (g.charCodeAt(0) - 65) * 20 - 180, lat = (g.charCodeAt(1) - 65) * 10 - 90;
  lon += +g[2] * 2; lat += +g[3];
  if (g.length >= 6) { lon += (g.charCodeAt(4) - 65) * (2 / 24) + 1 / 24; lat += (g.charCodeAt(5) - 65) * (1 / 24) + 0.5 / 24; }
  else { lon += 1; lat += 0.5; }
  return [lon, lat]; }
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const a = gridCenter(me.grid), b = gridCenter(them.grid);
const [l1, p1, l2, p2] = [rad(a[0]), rad(a[1]), rad(b[0]), rad(b[1])];
const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
const brg = (deg(Math.atan2(Math.sin(l2 - l1) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(l2 - l1))) + 360) % 360;
const arc = []; for (let i = 0; i <= 128; i++) { const f = i / 128, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
  const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2), y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2), z = A * Math.sin(p1) + B * Math.sin(p2);
  arc.push([deg(Math.atan2(y, x)), deg(Math.atan2(z, Math.hypot(x, y)))]); }
document.getElementById('route').textContent = `${me.call} → ${them.call}`;
document.getElementById('km').textContent = `${Math.round(d * 6371).toLocaleString('ru-RU')} km · ${Math.round(brg)}°`;
document.getElementById('note').textContent = 'Map: OpenFreeMap · the map server sees which areas are shown';
const map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
  center: zoomIn ? b : [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 15], zoom: zoomIn ? 9 : 1.3, attributionControl: false, preserveDrawingBuffer: true });
map.on('style.load', () => {
  map.setProjection({ type: 'globe' });
  map.addSource('arc', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: arc } } });
  map.addLayer({ id: 'arc', type: 'line', source: 'arc', paint: { 'line-color': '#e8a23d', 'line-width': 3 } });
  map.addSource('pts', { type: 'geojson', data: { type: 'FeatureCollection', features: [
    { type: 'Feature', properties: { t: me.call }, geometry: { type: 'Point', coordinates: a } },
    { type: 'Feature', properties: { t: them.call }, geometry: { type: 'Point', coordinates: b } }] } });
  map.addLayer({ id: 'pts', type: 'circle', source: 'pts', paint: { 'circle-radius': 6, 'circle-color': '#e8a23d', 'circle-stroke-color': '#1c1b19', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'lbl', type: 'symbol', source: 'pts', layout: { 'text-field': ['get', 't'], 'text-font': ['Noto Sans Bold'], 'text-size': 14, 'text-offset': [0, 1.3] },
    paint: { 'text-color': '#ffffff', 'text-halo-color': '#1c1b19', 'text-halo-width': 2 } });
});
map.on('idle', () => { window.__ready = true; });
map.on('error', e => { window.__err = String(e.error && e.error.message || e); });
</script>
</body></html>
